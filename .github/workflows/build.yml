name: Build OcuLauncher

# Parte quando pubblichi un tag tipo v1.0.0 (oppure a mano da Actions → Run workflow).
on:
  push:
    tags:
      - 'v*'
      - '!v*-staff'
  workflow_dispatch:

permissions:
  contents: write   # per caricare gli installer nella Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest   # produce .exe per x64 e ARM64
            args: --win --x64 --arm64
          - os: macos-latest     # produce .dmg per Intel e Apple Silicon
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm install --no-audit --no-fund

      - name: Compila e pubblica nella Release
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing blijft optioneel. Zonder secrets bouwt de workflow unsigned installers.
          # Windows: zet WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD voor Authenticode signing.
          # macOS: zet CSC_LINK + CSC_KEY_PASSWORD + Apple notarization secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_IDENTITY_AUTO_DISCOVERY || 'false' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pubblica la release come Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
