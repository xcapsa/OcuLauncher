name: Build OcuLauncher

# Parte quando pubblichi un tag tipo v1.0.0 (oppure a mano da Actions → Run workflow).
on:
  push:
    tags:
      - 'v*'
      - '!v*-staff'
  workflow_dispatch:

permissions:
  contents: write   # per caricare gli installer nella Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest   # produce .exe per x64 e ARM64
            args: --win --x64 --arm64
          - os: macos-latest     # produce .dmg per Intel e Apple Silicon
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm install --no-audit --no-fund

      - name: Compila e pubblica nella Release
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Su macOS senza certificato Apple: nessuna firma/notarizzazione.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Carica gli installer nella Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest*.yml)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pubblica la release come Latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
